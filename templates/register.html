{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-1">Register as {{ "Trek Staff" if role == "staff" else "Trekker" }}</h1>
        {% if role == "staff" %}
          <p class="text-muted small">Staff accounts need admin approval before dashboard access.</p>
        {% endif %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" name="name" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="contact">Contact Details</label>
            <input class="form-control" id="contact" name="contact">
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" id="password" name="password" type="password" minlength="6" required>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="confirm_password">Confirm Password</label>
              <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="6" required>
            </div>
          </div>
          <button class="btn btn-success mt-3 w-100" type="submit">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
