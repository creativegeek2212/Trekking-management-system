{% extends "base.html" %}
{% block title %}Assign Staff{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-1">Assign Staff</h1>
        <p class="text-muted">{{ trek.name }} • {{ trek.location }}</p>
        <form method="post">
          <label class="form-label" for="staff_id">Approved Staff</label>
          <select class="form-select" id="staff_id" name="staff_id">
            <option value="">Unassigned</option>
            {% for member in staff %}
              <option value="{{ member.id }}" {% if trek.assigned_staff_id == member.id %}selected{% endif %}>
                {{ member.name }} (ID {{ member.id }})
              </option>
            {% endfor %}
          </select>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-success" type="submit">Save Assignment</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin_treks') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
