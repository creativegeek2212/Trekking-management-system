{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">{{ title }}</h1>
        <form method="post">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label" for="name">Trek Name</label>
              <input class="form-control" id="name" name="name" value="{{ trek.name }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="difficulty">Difficulty</label>
              <select class="form-select" id="difficulty" name="difficulty" required>
                {% for value in ["Easy", "Moderate", "Hard"] %}
                  <option value="{{ value }}" {% if trek.difficulty == value %}selected{% endif %}>{{ value }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="location">Location</label>
              <input class="form-control" id="location" name="location" value="{{ trek.location }}" required>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="duration_days">Duration</label>
              <input class="form-control" id="duration_days" name="duration_days" type="number" min="1" value="{{ trek.duration_days }}" required>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="available_slots">Slots</label>
              <input class="form-control" id="available_slots" name="available_slots" type="number" min="0" value="{{ trek.available_slots }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="status">Status</label>
              <select class="form-select" id="status" name="status" required>
                {% for value in ["Pending", "Approved", "Open", "Ongoing", "Closed", "Completed"] %}
                  <option value="{{ value }}" {% if trek.status == value %}selected{% endif %}>{{ value }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="start_date">Start Date</label>
              <input class="form-control" id="start_date" name="start_date" type="date" value="{{ trek.start_date }}" required>
            </div>
            <div class="col-md-4">
              <label class="form-label" for="end_date">End Date</label>
              <input class="form-control" id="end_date" name="end_date" type="date" value="{{ trek.end_date }}" required>
            </div>
            <div class="col-12">
              <label class="form-label" for="description">Description</label>
              <textarea class="form-control" id="description" name="description" rows="4">{{ trek.description }}</textarea>
            </div>
          </div>
          <div class="mt-3 d-flex gap-2">
            <button class="btn btn-success" type="submit">Save Trek</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('admin_treks') }}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
